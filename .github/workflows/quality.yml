name: Course quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: make check
      - run: make demo
      - run: make solutions
      - run: make fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-demonstration-logs
          path: reports/demo

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: make mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutants/mutmut-cicd-stats.json

  atheris:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --group fuzz
      - run: make fuzz-atheris
