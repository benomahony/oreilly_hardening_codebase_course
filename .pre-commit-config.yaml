repos:
  - repo: local
    hooks:
      - id: format-and-lint
        name: Strict formatting and linting
        entry: make lint
        language: system
        pass_filenames: false
      - id: types
        name: Strict types and complete public annotations
        entry: make types
        language: system
        pass_filenames: false
      - id: nasa
        name: NASA rules and meaningful assertions
        entry: make nasa
        language: system
        pass_filenames: false
      - id: domain-language
        name: Domain vocabulary
        entry: make ddd
        language: system
        pass_filenames: false
      - id: test-quality
        name: Test Desiderata and mock detection
        entry: make desiderata mocks
        language: system
        pass_filenames: false
