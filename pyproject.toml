[project]
name = "quality-gates-demo"
version = "0.1.0"
description = "A small stock counter for demonstrating Python code quality tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservations"]

[dependency-groups]
dev = [
  "ruff", "basedpyright", "mypy", "pytest", "pytest-cov", "pytest-examples",
  "hypothesis", "import-linter", "nasa-lsp==0.1.14", "dddlint==0.1.11",
  "testdesiderata==0.1.2", "mockbuster==0.1.4", "mutmut", "pre-commit",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi"]
extend-exclude = ["examples", "mutants"]

[tool.ruff.lint]
select = ["ALL"]
# Assertions are intentional; these two rules conflict with Ruff's formatter.
# D203/D213 conflict with the chosen D211/D212 docstring conventions.
ignore = ["S101", "COM812", "ISC001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # Literal expected outcomes make tests readable.

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["examples", "mutants"]
typeCheckingMode = "all"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
xfail_strict = true
markers = [
  "property: generated domain and input properties",
  "architecture: executable import boundaries",
  "docs: documentation and ADR examples",
]

[tool.coverage.run]
branch = true
source = ["reservations"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.testdesiderata]
# Every static rule enabled; AI review is an explicitly separate optional step.
ignore = []

[tool.mockbuster]
path = "tests/"
disable = []

[tool.importlinter]
root_package = "reservations"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point toward the domain"
type = "layers"
layers = ["reservations.infrastructure", "reservations.application", "reservations.domain"]

[[tool.importlinter.contracts]]
name = "The domain has no framework or test dependencies"
type = "forbidden"
source_modules = ["reservations.domain"]
forbidden_modules = ["pytest", "hypothesis", "pydantic", "requests", "sqlite3"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/test_domain.py", "tests/test_application.py", "tests/test_infrastructure.py", "tests/test_properties.py"]
pytest_add_cli_args = ["-q", "-x"]
